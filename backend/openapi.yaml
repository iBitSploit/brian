openapi: 3.0.3
info:
  title: Brian API
  version: 1.0.0
  description: MVP API for network topology, inventory, integrations, scans, and agents.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /auth/login:
    post:
      security: []
      summary: Create an access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: JWT access token
  /devices:
    get:
      summary: List devices
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Search'
      responses:
        '200': { description: Paginated devices }
    post:
      summary: Create a device
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Device' }
      responses:
        '201': { description: Created device }
  /devices/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    get:
      summary: Get a device
      responses:
        '200': { description: Device }
    put:
      summary: Update a device
      responses:
        '200': { description: Updated device }
    delete:
      summary: Delete a device
      responses:
        '200': { description: Deleted device }
  /devices/bulk/import:
    post:
      summary: Import devices
      responses:
        '201': { description: Import summary }
  /devices/{id}/rescan:
    post:
      summary: Queue device rescan
      responses:
        '202': { description: Rescan queued }
  /topology:
    get:
      summary: Get topology graph
      responses:
        '200': { description: Nodes and edges }
  /topology/connections:
    post:
      summary: Create a topology connection
      responses:
        '201': { description: Created connection }
  /scans:
    get:
      summary: List scans
      responses:
        '200': { description: Scan results }
  /scans/upload:
    post:
      summary: Upload a normalized scan result
      responses:
        '202': { description: Scan accepted }
  /agents:
    get:
      summary: List agents
      responses:
        '200': { description: Agents }
  /agents/register:
    post:
      summary: Register an agent
      responses:
        '201': { description: Agent and one-time token }
  /agents/{id}/heartbeat:
    post:
      summary: Record an agent heartbeat
      responses:
        '200': { description: Updated status }
  /agents/{id}/report:
    post:
      summary: Submit agent findings
      responses:
        '202': { description: Report accepted }
  /integrations/netbox/test:
    post:
      summary: Test NetBox connection
      responses:
        '200': { description: Connection result }
  /integrations/netbox/sync:
    post:
      summary: Queue NetBox sync
      responses:
        '202': { description: Sync queued }
  /integrations/netbox/status:
    get:
      summary: Get NetBox sync status
      responses:
        '200': { description: Sync status }
  /integrations/netbox/config:
    put:
      summary: Configure NetBox
      responses:
        '200': { description: Configuration status }
  /icons:
    get:
      summary: List icons
      responses:
        '200': { description: Icons }
    post:
      summary: Register an icon
      responses:
        '201': { description: Icon }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
    Search:
      name: search
      in: query
      schema: { type: string }
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    Device:
      type: object
      required: [name, ip_address]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string }
        ip_address: { type: string }
        mac_address: { type: string, nullable: true }
        device_type: { type: string, default: other }
        status: { type: string, default: unknown }
        location: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        metadata: { type: object }
