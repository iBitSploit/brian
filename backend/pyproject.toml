[project]
name = "backend"
version = "0.1.0"
description = "Brian backend API and integration services"
readme = "README.md"
authors = [
    { name = "iBitSploit", email = "iBitSploit@proton.me" }
]
requires-python = ">=3.14"
dependencies = [
    "cryptography>=46.0.0",
    "fastapi>=0.141.1",
    "gunicorn>=26.2.0",
    "pynetbox==7.8.0",
    "sqlalchemy>=2.0.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "httpx>=0.27.0"]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
